// Dev container DHCPv4 server for the fake LAN on kea0 (192.168.50.0/24).
// Comments in all three styles on purpose: the page must cope with them.
{
"Dhcp4": {
    "interfaces-config": {
        "interfaces": [ "kea0" ]
    },
    "control-socket": {
        "socket-type": "unix",
        "socket-name": "kea4-ctrl-socket"
    },
    # No "name": Kea's default, /var/lib/kea/kea-leases4.csv
    "lease-database": {
        "type": "memfile",
        "lfc-interval": 600
    },
    "expired-leases-processing": {
        "reclaim-timer-wait-time": 10,
        "flush-reclaimed-timer-wait-time": 25,
        "hold-reclaimed-time": 3600
    },
    /* Short lifetimes so renewals show up while you watch */
    "renew-timer": 60,
    "rebind-timer": 90,
    "valid-lifetime": 120,
    "subnet4": [
        {
            "id": 1,
            "subnet": "192.168.50.0/24",
            "interface": "kea0",
            "pools": [ { "pool": "192.168.50.100 - 192.168.50.199" } ],
            "option-data": [ { "name": "routers", "data": "192.168.50.1" } ],
            "reservations": [
                {
                    "hw-address": "02:00:00:00:00:13",
                    "ip-address": "192.168.50.10",
                    "hostname": "nas",
                    "comment": "NAS in the cupboard, ports 3/4"
                },
                {
                    "hw-address": "02:00:00:00:00:21",
                    "ip-address": "192.168.50.20",
                    "hostname": "printer",
                    "user-context": { "description": "Office printer (2nd floor)" }
                }
            ]
        }
    ],
    "loggers": [
        {
            "name": "kea-dhcp4",
            "output-options": [ { "output": "stdout", "pattern": "%-5p %m\n" } ],
            "severity": "INFO"
        }
    ]
}
}
