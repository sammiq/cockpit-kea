// Dev container DHCPv6 server for the fake LAN on kea0 (fd00:50::/64).
{
"Dhcp6": {
    "interfaces-config": {
        "interfaces": [ "kea0" ]
    },
    "control-socket": {
        "socket-type": "unix",
        "socket-name": "kea6-ctrl-socket"
    },
    "lease-database": {
        "type": "memfile",
        "lfc-interval": 600
    },
    "expired-leases-processing": {
        "reclaim-timer-wait-time": 10,
        "flush-reclaimed-timer-wait-time": 25,
        "hold-reclaimed-time": 3600
    },
    "renew-timer": 60,
    "rebind-timer": 90,
    "preferred-lifetime": 100,
    "valid-lifetime": 120,
    "subnet6": [
        {
            "id": 1,
            "subnet": "fd00:50::/64",
            "interface": "kea0",
            "pools": [ { "pool": "fd00:50::1000 - fd00:50::1fff" } ],
            "pd-pools": [
                { "prefix": "fd00:50:100::", "prefix-len": 56, "delegated-len": 64 }
            ],
            "reservations": [
                {
                    "hw-address": "02:00:00:00:00:13",
                    "ip-addresses": [ "fd00:50::10" ],
                    "hostname": "nas",
                    "comment": "NAS in the cupboard, ports 3/4"
                }
            ]
        }
    ],
    "loggers": [
        {
            "name": "kea-dhcp6",
            "output-options": [ { "output": "stdout", "pattern": "%-5p %m\n" } ],
            "severity": "INFO"
        }
    ]
}
}
